<html lang="en">
<head>

<title>Flarebox – Game VFX Library</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2l12 7v14l-12 7-12-7V9z' fill='%231caad9'/%3E%3Cpath d='M17 7l-6 10h5l-1 8 6-10h-5z' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --accent: #1caad9;
    --accent-600: #1590ba;
    --accent-50: #e9f7fc;
    --bg: #f2f3f5;
    --surface: #ffffff;
    --border: #e2e5e9;
    --border-strong: #cfd5db;
    --text: #1d2731;
    --text-2: #4b5866;
    --muted: #87929d;
    --fav: #ff4f6d;
    --pick: #f5a623;
    --shadow: 0 1px 2px rgba(16,24,32,.06), 0 2px 6px rgba(16,24,32,.06);
    --shadow-h: 0 8px 22px rgba(16,24,32,.13), 0 2px 4px rgba(16,24,32,.06);
    --radius: 6px;
    --gutter: 40px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Open Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px; color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  input, select { font: inherit; color: inherit; }
  .i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .i.fill { fill: currentColor; stroke: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- Header ---------- */
  .topbar { background: var(--surface); position: sticky; top: 0; z-index: 30; }
  .head { display: flex; align-items: center; gap: 28px; height: 78px; padding: 0 var(--gutter); border-bottom: 1px solid var(--border); }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 23px; font-weight: 700; letter-spacing: -.4px; color: #253341; text-decoration: none; white-space: nowrap; }
  .logo svg { width: 34px; height: 34px; }
  .search { flex: 1; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 12px; border: 1px solid var(--border-strong); border-radius: 3px; background: #fff; transition: border-color .15s, box-shadow .15s; }
  .search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(28,170,217,.14); }
  .search .i { color: #7c8792; width: 20px; height: 20px; }
  .search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; font-size: 16px; }
  .search input::placeholder { color: #9aa4ad; }
  .search .clear { display: none; color: #4b5866; padding: 4px; border-radius: 3px; }
  .search .clear:hover { background: #f0f2f4; }
  .search.has-q .clear { display: inline-flex; }
  .search kbd { font: 600 11px/1 inherit; color: #9aa4ad; border: 1px solid var(--border); border-radius: 3px; padding: 3px 6px; }
  .search.has-q kbd, .search:focus-within kbd { display: none; }
  .btn-outline { height: 44px; padding: 0 20px; border: 1.5px solid var(--accent); color: var(--accent); border-radius: 3px; font-size: 13px; font-weight: 700; letter-spacing: .6px; text-transform: uppercase; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; transition: background .15s; }
  .btn-outline:hover { background: var(--accent-50); }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; align-items: stretch; padding: 0 var(--gutter); border-bottom: 1px solid var(--border); background: #fff; }
  .tabs-list { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .tabs-list::-webkit-scrollbar { display: none; }
  .tab { position: relative; height: 62px; padding: 0 24px; font-size: 17px; color: #3b4650; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
  .tab:first-child { padding-left: 28px; }
  .tab .count { font-size: 12px; font-weight: 600; color: var(--muted); background: #f0f2f4; border-radius: 10px; padding: 1px 7px; }
  .tab:hover { color: var(--accent); }
  .tab[aria-selected="true"] { color: var(--accent); }
  .tab[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 3px; background: var(--accent); border-radius: 2px 2px 0 0; }
  .tab[aria-selected="true"] .count { background: var(--accent-50); color: var(--accent-600); }
  .filters-toggle { display: inline-flex; align-items: center; gap: 8px; color: var(--accent); font-size: 17px; white-space: nowrap; padding-left: 16px; }
  .filters-toggle .i { width: 20px; height: 20px; }

  /* ---------- Filter toolbar ---------- */
  .toolbar { display: flex; align-items: flex-end; gap: 30px; padding: 16px var(--gutter) 18px; background: #fff; box-shadow: 0 2px 4px rgba(16,24,32,.04); border-bottom: 1px solid var(--border); }
  .toolbar[hidden] { display: none; }
  .toolbar .group { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .toolbar .group[hidden] { display: none; }
  .toolbar .lbl { font-size: 11.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); }
  .dd { display: inline-flex; align-items: center; gap: 6px; font-size: 17px; color: var(--accent); white-space: nowrap; }
  .dd::after { content: ""; border: 5px solid transparent; border-top-color: #9fb4bf; margin-top: 5px; }
  .dd:hover { color: var(--accent-600); }
  .dd.on { font-weight: 600; }
  .checks { display: flex; gap: 22px; flex-wrap: nowrap; }
  .check { display: inline-flex; align-items: center; gap: 9px; font-size: 17px; color: #3b4650; cursor: pointer; white-space: nowrap; user-select: none; }
  .check input { appearance: none; width: 18px; height: 18px; margin: 0; border: 1.5px solid #b9c1c9; border-radius: 3px; display: grid; place-content: center; cursor: pointer; transition: background .12s, border-color .12s; }
  .check input:checked { background: var(--accent); border-color: var(--accent); }
  .check input:checked::after { content: ""; width: 9px; height: 5px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px,-1px); }
  .reset { font-size: 12.5px; font-weight: 700; letter-spacing: .5px; color: var(--accent); text-transform: uppercase; padding-bottom: 3px; }
  .reset:disabled { color: #b9c1c9; cursor: default; }
  .toolbar > * { flex: none; }
  .toolbar .spacer { flex: 1 0 0; }
  .toolbar .sort { align-items: flex-start; }

  /* dropdown menu */
  .menu { position: fixed; z-index: 100; min-width: 220px; max-height: 360px; overflow: auto; background: #fff; border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 12px 32px rgba(16,24,32,.16); padding: 6px; }
  .menu[hidden] { display: none; }
  .menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 4px; text-align: left; font-size: 14px; color: var(--text-2); }
  .menu button:hover, .menu button:focus-visible { background: #f3f6f8; outline: 0; }
  .menu button[aria-checked="true"] { color: var(--accent-600); font-weight: 600; }
  .menu button .n { margin-left: auto; font-size: 12px; color: var(--muted); font-weight: 400; }
  .menu button .tick { width: 16px; color: var(--accent); }
  .menu button:disabled { opacity: .45; cursor: default; }

  /* ---------- Results ---------- */
  main { padding: 22px var(--gutter) 60px; min-height: 60vh; }
  .rhead { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; color: var(--text-2); font-size: 14px; min-height: 28px; }
  .rhead b { color: var(--text); }
  .chip-x { display: inline-flex; align-items: center; gap: 4px; padding: 3px 6px 3px 10px; border-radius: 14px; background: #fff; border: 1px solid var(--border); font-size: 12.5px; color: var(--text-2); }
  .chip-x:hover { border-color: var(--accent); color: var(--accent-600); }
  .chip-x .i { width: 14px; height: 14px; }
  .crumbs { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .crumbs h2 { margin: 0; font-size: 22px; color: var(--text); font-weight: 600; }
  .link-btn { color: var(--accent); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .link-btn:hover { color: var(--accent-600); }
  .link-btn.danger { color: #c7465b; }

  .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 30px; }
  .card { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; cursor: pointer; transition: box-shadow .18s, transform .18s; outline: none; }
  .card:hover, .card:focus-visible { box-shadow: var(--shadow-h); transform: translateY(-2px); }
  .card:focus-visible { box-shadow: 0 0 0 2px var(--accent), var(--shadow-h); }
  .thumb { position: relative; aspect-ratio: 16 / 9; overflow: hidden; }
  /* ---- Inspector (Unity-style) ---- */
  .v-grid.with-insp { grid-template-columns: 320px minmax(0,1fr) 370px; }
  .insp { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; background: #383838; color: #c8c8c8; font: 12px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; border-right: 1px solid #191919; }
  .insp[hidden] { display: none; }
  .insp button, .insp select, .insp input { font: inherit; color: inherit; }
  .insp-head { flex: none; background: #3e3e3e; border-bottom: 1px solid #222; padding: 8px 10px 8px; position: relative; }
  .ih-title { display: flex; align-items: center; gap: 7px; min-width: 0; margin-bottom: 7px; }
  .ih-title b { color: #e4e4e4; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ih-ico { width: 18px; height: 18px; flex: none; color: #8fb6e8; display: grid; place-items: center; } .ih-ico .i { width: 16px; height: 16px; }
  .ih-sub { margin-left: auto; color: #8a8a8a; font-size: 11px; flex: none; }
  .ih-row { display: flex; gap: 4px; align-items: center; }
  .ih-row button, .ih-menu button { height: 22px; padding: 0 8px; border-radius: 3px; background: #585858; border: 1px solid #2a2a2a; color: #dcdcdc; white-space: nowrap; }
  .ih-row button:hover, .ih-menu button:hover { background: #676767; } .ih-row button:disabled { opacity: .4; }
  .ih-row select { flex: 1; min-width: 0; height: 22px; border-radius: 3px; background: #2a2a2a; border: 1px solid #1a1a1a; padding: 0 4px; }
  .ih-menu { position: absolute; right: 10px; top: calc(100% - 4px); z-index: 6; display: grid; gap: 2px; padding: 4px; background: #2f2f2f; border: 1px solid #191919; border-radius: 4px; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  .ih-menu[hidden] { display: none; } .ih-menu button { text-align: left; background: transparent; border: 0; } .ih-menu button:disabled { opacity: .4; }
  .insp-body { flex: 1; min-height: 0; overflow: auto; padding-bottom: 24px; }
  .insp-body::-webkit-scrollbar { width: 10px; } .insp-body::-webkit-scrollbar-thumb { background: #5a5a5a; border-radius: 5px; border: 2px solid #383838; }
  .insp-resize { position: absolute; top: 0; right: -4px; width: 8px; height: 100%; cursor: col-resize; z-index: 5; }
  .insp-resize:hover { background: rgba(80,140,220,.35); }
  .insp-hier { padding: 4px 0; background: #303030; border-bottom: 1px solid #222; max-height: 170px; overflow: auto; }
  .insp-hier .hi { padding: 3px 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 5px; }
  .insp-hier .hi.sub { padding-left: 24px; } .insp-hier .hi .i { width: 13px; height: 13px; color: #8fb6e8; flex: none; }
  .insp-hier .hi small { color: #888; } .insp-hier .hi:hover { background: #3f3f3f; } .insp-hier .hi.on { background: #2c5d87; color: #fff; }
  .ic { border-bottom: 1px solid #262626; }
  .ic > header { display: flex; align-items: center; gap: 6px; padding: 5px 8px; background: #3e3e3e; font-weight: 600; color: #dedede; cursor: pointer; user-select: none; border-top: 1px solid #4a4a4a; }
  .ic > header small { font-weight: 400; color: #8a8a8a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ic > header .tri { width: 10px; font-size: 10px; color: #aaa; transition: transform .12s; }
  .ic.folded > header .tri { transform: rotate(-90deg); } .ic.folded > .ic-body { display: none; }
  .ic-body { padding: 4px 8px 8px 14px; }
  .ip { display: grid; grid-template-columns: minmax(70px, 40%) minmax(0, 1fr) 16px; align-items: center; gap: 6px; min-height: 22px; padding: 1px 0; }
  .ip.stack { align-items: start; } .ip.stack > .ip-f { display: grid; gap: 2px; } .ip.stack .ip { grid-template-columns: 34px minmax(0,1fr) 0; } .ip.stack .ip .ip-reset { display: none; }
  .ip-l { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #c4c4c4; }
  .ip-l.scrub { cursor: ew-resize; }
  .ip.mod > .ip-l, .itex.mod .it-lab { color: #7fb8ff; font-weight: 600; }
  .ip.mod > .ip-l::before, .itex.mod .it-lab::before { content: ""; display: inline-block; width: 2px; height: 12px; background: #3d8fe8; margin-right: 5px; vertical-align: -2px; }
  .ip-f { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .ip-f.multi > i, .ip-f > i { font-style: normal; color: #8f8f8f; font-size: 11px; flex: none; }
  .ip-reset { width: 16px; height: 16px; padding: 0; border-radius: 3px; color: #8f8f8f; background: transparent; visibility: hidden; font-size: 12px; line-height: 1; }
  .ip.mod > .ip-reset, .itex.mod .ip-reset { visibility: visible; } .ip-reset:hover { color: #fff; background: #555; }
  .ip-num { display: flex; align-items: center; gap: 5px; flex: 1; min-width: 0; }
  .ip-num input[type=text], .ip-color input[type=text], .gsel input[type=text], .ip-f > select, .ip-f > input[type=text] { height: 19px; min-width: 0; width: 100%; background: #2a2a2a; border: 1px solid #1d1d1d; border-radius: 3px; padding: 0 5px; color: #e0e0e0; }
  .ip-num input[type=text]:focus, .ip-color input:focus, .gsel input:focus { outline: none; border-color: #3d8fe8; }
  .ip-f > select { height: 20px; padding: 0 3px; }
  .ip-num input[type=range], .ip-color input[type=range], .gsel input[type=range] { flex: 1 1 60%; min-width: 40px; height: 14px; accent-color: #6aa4e8; }
  .ip-num input[type=range] + input { flex: 0 0 48px; }
  .ip input[type=checkbox] { width: 14px; height: 14px; accent-color: #3d8fe8; margin: 0; }
  .ip-curve { flex: none; width: 64px; height: 18px; border-radius: 2px; border: 1px solid #1d1d1d; }
  .ip-color { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
  .ip-color .sw { position: relative; flex: none; width: 34px; height: 18px; border-radius: 2px; border: 1px solid #1d1d1d; background: var(--c); cursor: pointer; }
  .ip-color .sw input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }
  .ip-color .hex { flex: 0 0 64px; text-transform: uppercase; } .ip-color .in { flex: 0 0 38px; } .ip-color .al { flex: 1 1 40px; }
  .ip-grad { display: grid; gap: 3px; flex: 1; min-width: 0; position: relative; }
  .gbar { width: 100%; height: 16px; border-radius: 2px; border: 1px solid #1d1d1d; cursor: pointer; display: block; }
  .gedit { grid-column: 1 / -1; margin-top: 4px; padding: 8px; background: #2c2c2c; border: 1px solid #1a1a1a; border-radius: 4px; }
  .gbig { width: 100%; height: 22px; display: block; border: 1px solid #1a1a1a; }
  .gk { position: relative; height: 12px; margin: 0 6px; cursor: copy; }
  .gkey { position: absolute; width: 10px; height: 11px; margin-left: -5px; background: var(--c); border: 1px solid #111; box-shadow: 0 0 0 1px #888 inset; cursor: ew-resize; }
  .gk.top .gkey { clip-path: polygon(0 0, 100% 0, 100% 60%, 50% 100%, 0 60%); }
  .gk.bot .gkey { clip-path: polygon(50% 0, 100% 40%, 100% 100%, 0 100%, 0 40%); }
  .gkey.on { box-shadow: 0 0 0 2px #3d8fe8 inset; }
  .gsel { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; margin-top: 6px; }
  .gsel i { font-style: normal; color: #8f8f8f; font-size: 11px; } .gsel [hidden] { display: none !important; }
  .gs-c, .gs-a { display: flex; align-items: center; gap: 4px; flex: 1 1 140px; } .gs-c input[type=color] { width: 30px; height: 20px; border: 1px solid #1a1a1a; padding: 0; background: none; }
  .gsel .loc { width: 48px !important; flex: none; } .gsel button { height: 20px; padding: 0 7px; border-radius: 3px; background: #585858; border: 1px solid #222; }
  .ip-note { color: #8a8a8a; font-size: 11px; margin: 4px 0; }
  .itex { position: relative; padding: 6px 0 4px; border-top: 1px solid #303030; }
  .itex:first-child { border-top: 0; }
  .itex.drop { outline: 2px dashed #3d8fe8; outline-offset: -2px; background: rgba(61,143,232,.08); }
  .it-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; } .it-top small { color: #848484; font-weight: 400; }
  .it-main { display: flex; gap: 8px; align-items: center; }
  .it-thumb { flex: none; width: 54px; height: 54px; border-radius: 3px; border: 1px solid #1a1a1a; background-color: #222; background-image: none; background-size: cover; background-position: center; display: grid; place-items: center; color: #777; font-size: 10px;
    background-image: linear-gradient(45deg,#2c2c2c 25%,transparent 0 75%,#2c2c2c 0), linear-gradient(45deg,#2c2c2c 25%,transparent 0 75%,#2c2c2c 0); background-size: 10px 10px; background-position: 0 0, 5px 5px; }
  .it-thumb[style*="url"] { background-size: cover; background-position: center; }
  .it-info { min-width: 0; flex: 1; display: grid; gap: 5px; }
  .it-name { color: #e0e0e0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .it-btns { display: flex; gap: 3px; flex-wrap: wrap; } .it-btns button { height: 20px; padding: 0 7px; border-radius: 3px; background: #585858; border: 1px solid #262626; font-size: 11px; } .it-btns button:hover { background: #686868; }
  .itex .ip { margin-top: 2px; }
  .tlib { position: absolute; left: 0; right: 0; top: 100%; z-index: 8; max-height: 320px; display: flex; flex-direction: column; background: #2c2c2c; border: 1px solid #141414; border-radius: 4px; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  .tlib header { display: flex; align-items: baseline; gap: 6px; padding: 7px 8px; border-bottom: 1px solid #1d1d1d; } .tlib header small { color: #888; font-size: 10.5px; flex: 1; } .tlib .x { background: none; color: #aaa; }
  .tl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 6px; padding: 8px; overflow: auto; }
  .tl-grid button { display: grid; gap: 2px; padding: 0; background: none; text-align: center; color: #bbb; }
  .tl-grid button span { aspect-ratio: 1; border-radius: 3px; border: 1px solid #1a1a1a; background-color: #1d1d1d; background-size: cover; background-position: center; }
  .tl-grid button:hover span { border-color: #3d8fe8; } .tl-grid small { font-size: 9.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 900px) { .insp { display: none !important; } .v-grid.with-insp { grid-template-columns: 1fr !important; } }

  /* ---- Repo scans ---- */
  .scan-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  .scan-card { background: #fff; border: 1px solid var(--line, #e5e8eb); border-radius: 8px; padding: 18px; cursor: pointer; display: grid; gap: 10px; transition: box-shadow .15s, border-color .15s; }
  .scan-card:hover { border-color: var(--accent); box-shadow: 0 6px 20px rgba(20,40,60,.08); }
  .scan-card h3 { font-size: 16px; display: flex; align-items: center; gap: 8px; } .scan-card h3 .i { color: var(--accent); }
  .scan-card .sub { color: var(--muted); font-size: 12.5px; word-break: break-all; }
  .scan-kpis { display: flex; gap: 18px; flex-wrap: wrap; } .scan-kpis div { display: grid; } .scan-kpis b { font-size: 20px; } .scan-kpis span { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .scan-kpis .bad b { color: #d0453a; }
  .sc-prevbar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; background: #eaf7fc; color: #12617e; font-size: 13px; } .sc-prevbar .i { color: var(--accent); } .sc-prevbar span { flex: 1; }
  .sc-prev { height: 24px; padding: 0 9px; margin-right: 8px; font-size: 11.5px; vertical-align: 1px; }
  .sc-cover { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; border-radius: 6px; overflow: hidden; background: #1a1d22; }
  .sc-cover > div { position: relative; aspect-ratio: 16/9; overflow: hidden; }
  .gh-import { background: #fff; border: 1px solid var(--line, #e5e8eb); border-radius: 8px; padding: 16px 18px; display: grid; gap: 10px; margin-bottom: 20px; }

  .bgsw .sw-white { background: #fff; }
  .bgsw .sw-checker { background-color: #fff; background-image: conic-gradient(#bfc5cc 25%, transparent 0 50%, #bfc5cc 0 75%, transparent 0); background-size: 8px 8px; }
  .ctl-sep { width: 1px; height: 22px; background: rgba(255,255,255,.1); }

  .details { overflow-y: auto; padding: 22px 24px 28px; border-left: 1px solid var(--border); position: relative; }
  .v-close { position: absolute; top: 14px; right: 14px; width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); background: #f3f5f7; z-index: 3; }
  .v-close:hover { background: #e6eaee; color: var(--text); }
  .d-chips { display: flex; gap: 6px; margin-bottom: 10px; padding-right: 40px; }
  .pick-chip { font-size: 11.5px; font-weight: 600; color: #b5700a; background: #fff3dd; border-radius: 10px; padding: 2px 9px; display: inline-flex; align-items: center; gap: 4px; }
  .pick-chip .i { width: 12px; height: 12px; }
  .d-title { margin: 0 0 14px; font-size: 22px; line-height: 1.25; padding-right: 30px; }
  .d-author { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .d-author .avatar { width: 34px; height: 34px; font-size: 12px; border-radius: 4px; }
  .d-author b { display: block; font-size: 14px; }
  .d-author small { color: var(--muted); font-size: 12.5px; }
  .d-stats { display: flex; gap: 18px; color: var(--text-2); font-size: 13px; margin-bottom: 16px; }
  .d-stats span { display: inline-flex; align-items: center; gap: 5px; }
  .d-stats .i { width: 16px; height: 16px; color: var(--muted); }
  .d-actions { display: flex; gap: 8px; margin-bottom: 18px; }
  .d-actions .btn { flex: 1; }
  .d-desc { margin: 0 0 18px; color: var(--text-2); line-height: 1.55; }
  .details h4 { margin: 20px 0 9px; font-size: 11.5px; letter-spacing: .5px; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .specs { display: grid; grid-template-columns: auto 1fr; gap: 7px 16px; margin: 0; font-size: 13.5px; }
  .specs dt { color: var(--muted); }
  .specs dd { margin: 0; color: var(--text); font-weight: 500; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12.5px; padding: 4px 10px; border-radius: 14px; background: #f1f3f5; color: var(--text-2); }
  .chip.eng { background: #eef4ff; color: #3459b8; font-weight: 600; }
  button.chip:hover { background: var(--accent-50); color: var(--accent-600); }
  .links { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .links li + li { border-top: 1px solid var(--border); }
  .links button, .links .src { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 14px; text-align: left; font-size: 13.5px; }
  .links button:hover { background: #f6f9fb; }
  .links button:disabled { opacity: .5; cursor: default; background: none; }
  .links .ico { width: 30px; height: 30px; border-radius: 6px; background: var(--accent-50); color: var(--accent-600); display: grid; place-items: center; flex: none; }
  .links .ico .i { width: 16px; height: 16px; }
  .links b { display: block; color: var(--text); font-weight: 600; }
  .links small { color: var(--muted); font-size: 12px; }
  .links .go { margin-left: auto; color: var(--muted); }
  .links .danger .ico { background: #fdecef; color: #c7465b; }
  .related { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rel { border-radius: 5px; overflow: hidden; background: #fff; box-shadow: var(--shadow); text-align: left; transition: box-shadow .15s; }
  .rel:hover { box-shadow: var(--shadow-h); }
  .rel .rt { aspect-ratio: 16/9; position: relative; }
  .rel .rt img, .rel .rt .sprite-still { position: absolute; inset: 0; width: 100%; height: 100%; }
  .sprite-still { background-repeat: no-repeat; }
  .col-card .thumb > div .sprite-still { position: absolute; inset: 0; }
  .rel span { display: block; padding: 6px 8px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---------- Small dialogs ---------- */
  .dlg { width: min(440px, 94vw); border-radius: 8px; box-shadow: 0 24px 60px rgba(0,0,0,.3); }
  .dlg.wide { width: min(560px, 94vw); }
  .dlg header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
  .dlg header h3 { margin: 0; font-size: 17px; }
  .dlg .x { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--text-2); }
  .dlg .x:hover { background: #f1f3f5; }
  .dlg .body { padding: 14px 18px; max-height: 60vh; overflow: auto; }
  .dlg footer { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px 16px; border-top: 1px solid var(--border); }
  .col-row { display: flex; align-items: center; gap: 12px; padding: 9px 6px; border-radius: 5px; cursor: pointer; }
  .col-row:hover { background: #f5f7f9; }
  .col-row .check { font-size: 14.5px; flex: 1; }
  .col-row small { color: var(--muted); }
  .col-new { display: flex; gap: 8px; margin-top: 10px; }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .field label, .field .flabel { font-size: 12px; font-weight: 600; color: var(--text-2); }
  .inp { height: 38px; border: 1px solid var(--border-strong); border-radius: 4px; padding: 0 10px; background: #fff; outline: 0; width: 100%; }
  .inp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(28,170,217,.14); }
  .row-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .drop { border: 2px dashed #c8d0d7; border-radius: 8px; padding: 22px; text-align: center; color: var(--text-2); cursor: pointer; margin-bottom: 14px; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-50); }
  .drop b { color: var(--accent-600); }
  .drop small { display: block; color: var(--muted); margin-top: 4px; }
  .eng-checks { display: flex; flex-wrap: wrap; gap: 8px 16px; }
  .eng-checks .check { font-size: 13.5px; gap: 7px; }
  .note { font-size: 12px; color: var(--muted); margin: 0 0 12px; }

  /* toast */
  .toast { position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px); background: #1d2731; color: #fff; padding: 11px 18px; border-radius: 6px; font-size: 13.5px; box-shadow: 0 8px 24px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 1000; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- Responsive ---------- */
  @media (max-width: 1280px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; } }
  @media (max-width: 1100px) {
    .toolbar { overflow-x: auto; gap: 24px; scrollbar-width: thin; }
    .checks { gap: 16px; }
  }
  @media (max-width: 900px) {
    :root { --gutter: 20px; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
    .head { gap: 14px; height: 66px; }
    .logo span { display: none; }
    .btn-outline .lbl-long { display: none; }
    .btn-outline { padding: 0 14px; }
    .tab { font-size: 15px; padding: 0 14px; height: 52px; }
    .tab:first-child { padding-left: 14px; }
    .filters-toggle { font-size: 15px; }
    .filters-toggle .lbl-long { display: none; }
    .dd, .check { font-size: 15px; }
    .viewer { width: 100vw; height: 100dvh; max-height: 100dvh; border-radius: 0; }
    .v-grid { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .stage { flex: none; height: 44vh; }
    .stage .nav { opacity: 1; }
    .details { border-left: 0; }
    .v-close { position: fixed; top: 10px; right: 10px; background: rgba(255,255,255,.9); }
    .controls { gap: 6px; padding: 8px 10px; }
    .ctl-sep:not(.push) { display: none; }
    .ctl-sep.push { visibility: hidden; }
  }
  @media (max-width: 560px) {
    :root { --gutter: 16px; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .search kbd { display: none; }
    .row-3 { grid-template-columns: 1fr 1fr; }
  }
  @media (hover: none) {
    .t-actions { opacity: 1; transform: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .card:hover { transition: none; transform: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <header class="head">
    <a class="logo" href="#" id="home" aria-label="Flarebox home">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 1.5l13 7.5v14l-13 7.5-13-7.5V9z" fill="#1caad9"/><path d="M16 1.5l13 7.5-13 7.5L3 9z" fill="#3fc0ea"/><path d="M17.5 8l-6.5 10h5l-1.5 8 7-11h-5.2z" fill="#fff"/></svg>
      <span>Flarebox</span>
    </a>
    <label class="search" id="searchBox">
      <svg class="i"><use href="#i-search"/></svg>
      <span class="sr">Search effects</span>
      <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search VFX — fire, slash, portal, URP…">
      <kbd>/</kbd>
      <button class="clear" id="clearQ" type="button" aria-label="Clear search"><svg class="i"><use href="#i-x"/></svg></button>
    </label>
    <div class="head-actions">
      <button class="btn-outline icon-only" id="settingsBtn" type="button" aria-label="Settings" title="Settings (GitHub token, import options)"><svg class="i"><use href="#i-gear"/></svg></button>
      <button class="btn-outline" id="uploadBtn" type="button"><svg class="i"><use href="#i-upload"/></svg><span class="lbl-long">Upload VFX</span></button>
    </div>
  </header>

  <nav class="tabs" aria-label="Library sections">
    <div class="tabs-list" role="tablist" id="tabs">
      <button class="tab" role="tab" data-tab="all" aria-selected="true">Effects <span class="count" id="c-all"></span></button>
      <button class="tab" role="tab" data-tab="projects" aria-selected="false">Projects <span class="count" id="c-projects"></span></button>
      <button class="tab" role="tab" data-tab="favs" aria-selected="false">Favorites <span class="count" id="c-favs"></span></button>
      <button class="tab" role="tab" data-tab="cols" aria-selected="false">Collections <span class="count" id="c-cols"></span></button>
      <button class="tab" role="tab" data-tab="recent" aria-selected="false">Recently viewed <span class="count" id="c-recent"></span></button>
      <button class="tab" role="tab" data-tab="scans" aria-selected="false">Repo scans <span class="count" id="c-scans"></span></button>
      <button class="tab" role="tab" data-tab="settings" aria-selected="false">Settings</button>
    </div>
    <button class="filters-toggle" id="filtersToggle" type="button" aria-expanded="true" aria-controls="toolbar"><svg class="i"><use href="#i-sliders"/></svg><span class="lbl-long">Filters &amp; Sort</span></button>
  </nav>

  <div class="toolbar" id="toolbar">
    <div class="group"><span class="lbl">Source</span><button class="dd" data-dd="src" type="button"></button></div>
    <div class="group"><span class="lbl">Category</span><button class="dd" data-dd="cat" type="button"></button></div>
    <div class="group"><span class="lbl">Art style</span><button class="dd" data-dd="style" type="button"></button></div>
    <div class="group"><span class="lbl">Compatibility</span><button class="dd" data-dd="engine" type="button"></button></div>
    <div class="group"><span class="lbl">Type</span><button class="dd" data-dd="type" type="button"></button></div>
    <div class="group"><span class="lbl">Others</span>
      <div class="checks">
        <label class="check"><input type="checkbox" data-flag="dl">Downloadable</label>
        <label class="check"><input type="checkbox" data-flag="loop">Looping</label>
        <label class="check"><input type="checkbox" data-flag="pick">Staff picks</label>
      </div>
    </div>
    <button class="reset" id="resetBtn" type="button">Reset</button>
    <div class="spacer"></div>
    <div class="group sort"><span class="lbl">Sort by</span><button class="dd" data-dd="sort" type="button"></button></div>
  </div>
</div>

<main id="main">
  <div class="rhead" id="rhead"></div>
  <div class="grid" id="grid"></div>
  <div class="sentinel" id="sentinel"></div>
  <div class="more-hint" id="moreHint" hidden></div>
</main>

<div class="menu" id="menu" role="menu" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- VFX preview -->
<dialog class="viewer" id="viewer" aria-label="VFX preview">
  <div class="v-grid">
    <div class="v-left">
      <div class="stage bg-dark" id="stage">
        <span class="hint">Space play/pause · R restart · L loop · ←/→ browse</span>
        <div class="orbit-hud" id="orbitHud"><span class="dial"><i id="orbitNeedle"></i></span><output id="orbitLbl">Drag to rotate 360°</output><button type="button" id="orbitSpin" aria-pressed="false" title="Auto-rotate (A)">Auto 360°</button><button type="button" id="orbitReset" title="Front view (F)">Front</button></div>
        <button class="nav prev" id="vPrev" type="button" aria-label="Previous effect"><svg class="i"><use href="#i-left"/></svg></button>
        <button class="nav next" id="vNext" type="button" aria-label="Next effect"><svg class="i"><use href="#i-right"/></svg></button>
      </div>
      <div class="controls">
        <button class="cbtn" id="cPlay" type="button" aria-label="Pause"><svg class="i"><use href="#i-pause"/></svg></button>
        <button class="cbtn" id="cRestart" type="button" aria-label="Restart" title="Restart (R)"><svg class="i"><use href="#i-restart"/></svg></button>
        <div class="timeline"><input id="cTime" type="range" min="0" max="1000" value="0" aria-label="Timeline"><output id="cTimeLbl">0.00 / 0.00s</output></div>
        <button class="cbtn on" id="cLoop" type="button" aria-pressed="true" aria-label="Loop" title="Loop (L)"><svg class="i"><use href="#i-loop"/></svg></button>
        <span class="ctl-sep push"></span>
        <div class="seg" id="cSpeed" role="group" aria-label="Playback speed"></div>
        <span class="ctl-sep"></span>
        <div class="bgsw" id="cBg" role="group" aria-label="Preview background">
          <button type="button" class="sw-dark" data-bg="dark" aria-pressed="true" title="Dark background" aria-label="Dark background"></button>
          <button type="button" class="sw-white" data-bg="white" aria-pressed="false" title="White background" aria-label="White background"></button>
          <button type="button" class="sw-checker" data-bg="checker" aria-pressed="false" title="Transparent (checkerboard)" aria-label="Transparent checkerboard background"></button>
        </div>
      </div>
    </div>
    <aside class="details" id="details"></aside>
  </div>
  <button class="v-close" id="vClose" type="button" aria-label="Close preview"><svg class="i"><use href="#i-x"/></svg></button>
</dialog>

<!-- Save to collection -->
<dialog class="dlg" id="colDlg" aria-labelledby="colDlgT">
  <header><h3 id="colDlgT">Save to collection</h3><button class="x" type="button" data-close aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></header>
  <div class="body">
    <div id="colList"></div>
    <form class="col-new" id="colNewForm">
      <input class="inp" id="colNewName" maxlength="40" placeholder="New collection name" aria-label="New collection name">
      <button class="btn primary" type="submit"><svg class="i"><use href="#i-plus"/></svg>Create</button>
    </form>
  </div>
  <footer><button class="btn" type="button" data-close>Done</button></footer>
</dialog>

<!-- Name prompt (new / rename collection) -->
<dialog class="dlg" id="nameDlg" aria-labelledby="nameDlgT">
  <form id="nameForm">
    <header><h3 id="nameDlgT">New collection</h3><button class="x" type="button" data-close aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></header>
    <div class="body"><div class="field"><label for="nameInp">Name</label><input class="inp" id="nameInp" maxlength="40" required></div></div>
    <footer><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit">Save</button></footer>
  </form>
</dialog>

<!-- Upload -->
<dialog class="dlg wide" id="upDlg" aria-labelledby="upDlgT">
  <form id="upForm">
    <header><h3 id="upDlgT">Upload a VFX preview</h3><button class="x" type="button" data-close aria-label="Close"><svg class="i"><use href="#i-x"/></svg></button></header>
    <div class="body">
      <label class="drop" id="drop">
        <input type="file" id="upFile" accept="video/mp4,video/webm,image/gif,image/png,image/webp,image/jpeg,.mp4,.webm,.gif,.png,.webp,.jpg" hidden>
        <div id="dropTxt"><b>Choose a file</b> or drop it here<small>MP4 · WebM · GIF · PNG/WebP sprite sheet — stays on this computer</small></div>
      </label>
      <div class="field"><label for="upName">Name</label><input class="inp" id="upName" maxlength="60" required placeholder="e.g. Meteor Impact"></div>
      <div class="row-3">
        <div class="field"><label for="upCat">Category</label><select class="inp" id="upCat"></select></div>
        <div class="field"><label for="upStyle">Art style</label><select class="inp" id="upStyle"></select></div>
        <div class="field"><label for="upType">Type</label><select class="inp" id="upType"></select></div>
      </div>
      <div class="field"><span class="flabel">Compatibility</span><div class="eng-checks" id="upEng"></div></div>
      <div id="sheetFields" hidden>
        <p class="note">Sprite sheet layout — frames are read left-to-right, top-to-bottom.</p>
        <div class="row-3">
          <div class="field"><label for="upCols">Columns</label><input class="inp" id="upCols" type="number" min="1" max="64" value="6"></div>
          <div class="field"><label for="upRows">Rows</label><input class="inp" id="upRows" type="number" min="1" max="64" value="6"></div>
          <div class="field"><label for="upFps">FPS</label><input class="inp" id="upFps" type="number" min="1" max="120" value="24"></div>
        </div>
      </div>
      <div class="field"><label for="upTags">Tags (comma separated)</label><input class="inp" id="upTags" placeholder="meteor, fire, impact"></div>
    </div>
    <footer><button class="btn" type="button" data-close>Cancel</button><button class="btn primary" type="submit" id="upSubmit" disabled>Add to library</button></footer>
  </form>
</dialog>

<!-- Optional VFX packs baked from Unity (vfx/index.js loads every vfx/<pack>/manifest.js). -->
<script src="vfx/index.js"></script>
<!-- Repository scans (tools/flarebox_scan_repo.py writes vfx/scans/index.js; full reports load on demand). -->
<script src="vfx/scans/index.js"></script>
<!-- Review collections created by GitHub imports (flarebox_scan_repo.py --collection). -->
<script src="vfx/scans/collections.js" onerror="void 0"></script>

/* =====================================================================
   Repo scans — reports from tools/flarebox_scan_repo.py: every Unity VFX in a repository,
   its type, category and full dependency trace (GUID-resolved), missing / stale references, orphans.
   ===================================================================== */
/* GitHub import: paste a repo link → tools/flarebox_server.py runs the scanner with --collection → the page reloads
   straight into the new review collection. Opened as a plain file, the page shows the equivalent command instead. */
/* Settings tab — importer configuration kept by tools/flarebox_server.py in ~/.flarebox/config.json.
   The token is write-only from here: the server only ever returns whether one is set and its last 4 characters. */
const Settings = {
  data: null, cache: null, err: '', msg: '', test: null, busy: false,
  async api(path, body) {
    const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || (r.status === 404 || r.status === 501 ? 'NOSERVER' : 'HTTP ' + r.status));
    return d;
  },
  async render() {
    const grid = $('#grid'); grid.classList.add('scan-mode');
    $('#rhead').innerHTML = '<span><b>Settings</b></span>';
    if (!Importer.served) { grid.innerHTML = this.offline(); return; }
    if (!this.data) {
      grid.innerHTML = '<div class="loading" style="position:static;height:200px;grid-column:1/-1"></div>';
      try { this.data = await this.api('/api/settings'); this.cache = await this.api('/api/cache').catch(() => null); } catch (e) { if (state.tab === 'settings') grid.innerHTML = this.offline(); return; }
      if (state.tab !== 'settings') return;
    }
    grid.innerHTML = this.html(); this.bind(grid);
  },
  offline() {
    return `<div class="set-wrap"><section class="set-card"><h3>${icon('sliders')} Settings need the local server</h3>
      <p class="dim">Settings are stored by the Flarebox server on this computer. Start it and open <b>http://localhost:8790</b>:</p>
      <code class="set-code">python3 tools/flarebox_server.py</code></section></div>`;
  },
  html() {
    const d = this.data, t = d.token, b = this.busy ? 'disabled' : '';
    const status = !t.set ? `<span class="set-pill off">No token</span> Public repositories only · GitHub allows about 60 requests/hour, so big repos may stop half-way.`
      : t.source === 'env' ? `<span class="set-pill on">Token active ${esc(t.hint)}</span> from the <kbd>GITHUB_TOKEN</kbd> environment variable. Save one here to override it.`
      : `<span class="set-pill on">Token saved ${esc(t.hint)}</span> stored on this computer only.`;
    const tr = this.test, test = !tr ? '' : tr.ok
      ? `<div class="set-ok">${icon('check')} Works${tr.login ? ` — signed in as <b>${esc(tr.login)}</b>` : ''}${tr.withToken ? '' : ' (no token)'} · ${tr.remaining ?? '?'} / ${tr.limit ?? '?'} API requests left this hour.</div>${tr.warning ? `<div class="gh-err">⚠ ${esc(tr.warning)}</div>` : ''}`
      : `<div class="gh-err">${esc(tr.error)}</div>`;
    const lim = String(d.previewLimit), opts = [['all', 'All VFX (recommended)'], ['500', 'First 500'], ['200', 'First 200'], ['50', 'First 50']];
    if (!opts.some(o => o[0] === lim)) opts.push([lim, 'First ' + lim]);
    return `<div class="set-wrap">
      <section class="set-card"><h3>${icon('link')} GitHub access</h3>
        <div class="set-status">${status}</div>
        <form class="set-row" id="tokForm" autocomplete="off">
          <input id="tokIn" type="password" placeholder="${t.set ? 'Paste a new token to replace it' : 'github_pat_… or ghp_…'}" spellcheck="false" autocomplete="new-password" ${b}>
          <button class="btn primary" type="submit" ${b}>Save token</button>
          <button class="btn" type="button" data-set="test" ${b}>Test</button>
          ${t.source === 'settings' ? `<button class="btn danger-btn" type="button" data-set="clear" ${b}>Remove</button>` : ''}
        </form>
        ${test}${this.err ? `<div class="gh-err">${esc(this.err)}</div>` : ''}${this.msg ? `<div class="set-ok">${esc(this.msg)}</div>` : ''}
        <details class="set-help"><summary>How to create a token</summary><ol>
          <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub › Settings › Developer settings › Fine-grained tokens › Generate new token</a>.</li>
          <li><b>Resource owner</b>: your account, or the organization that owns the repos (it may need an admin's approval).</li>
          <li><b>Repository access</b>: the repos you want to import. <b>Permissions › Contents: Read-only</b> — nothing else is needed.</li>
          <li>Generate, copy the token, paste it above and press <b>Save token</b>, then <b>Test</b>.</li></ol></details>
      </section>
      <section class="set-card"><h3>${icon('cube')} Import</h3>
        <label class="set-field"><span>3D previews per import</span>
          <select id="limSel" ${b}>${opts.map(([v, l]) => `<option value="${esc(v)}" ${v === lim ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>
        <p class="dim">Every VFX is always listed in the scan report; this only limits how many get a realtime 3D preview in the review collection. Large repos with thousands of effects take longer with “All”.</p>
      </section>
      ${this.cacheHTML(b)}
      <section class="set-card"><h3>${icon('file')} Where settings are stored</h3>

  },
  cacheHTML(b) {

        <tr class="tot"><td>Total</td><td>${mb(c.bytes)}</td><td><button class="link-btn danger-btn" type="button" data-set="cache-clear" data-repo="" ${b}>Clear all</button></td></tr></table>` : '<p class="dim">Empty.</p>'}

  },
  bind(grid) {

      this.busy = true; this.err = ''; this.msg = ''; grid.innerHTML = this.html();
      try { await fn(); if (okMsg) this.msg = okMsg; } catch (e) { this.err = e.message === 'NOSERVER' ? 'The local server is not running.' : e.message; }

      if (!v) { this.err = 'Paste a token first.'; this.msg = ''; grid.innerHTML = this.html(); return this.bind(grid); }
      run(async () => { this.data = await this.api('/api/settings', { githubToken: v }); this.test = await this.api('/api/settings/test', {}); }, 'Token saved.');
    };
    grid.onclick = e => {
      const a = e.target.closest('[data-set]'); if (!a) return;

    };
    $('#limSel', grid).onchange = e => run(async () => { this.data = await this.api('/api/settings', { previewLimit: e.target.value }); }, 'Saved.');
  },
};

const Importer = {
  job: null, log: [], state: 'idle', url: '', name: '', branch: '', err: '',
  br: null, brFor: '', brTimer: 0,  // branch list of the repo in the link: {default, branches} | {error} | 'loading'
  served: /^https?:$/.test(location.protocol),
  LOCAL: 'http://localhost:8790/',
  serverUp: false, probed: false,
  cmd(url) { return `python3 tools/flarebox_scan_repo.py ${url || 'https://github.com/<owner>/<repo>'} --collection${this.branch ? ' --branch ' + this.branch : ''}`; },

    opts.push(['all', list.length ? `All branches (${list.length})` : 'All branches']);

  loadBranches(url) {

      : `This page is opened as a file, so the import continues at <a href="${this.LOCAL}">${this.LOCAL.slice(0, -1)}</a> (your link is carried over). If that page does not open, start the server first:<code>python3 tools/flarebox_server.py</code>or run the import yourself and reload: <button type="button" class="link-btn" data-copy-cmd>copy command</button>`;

    u.onchange = () => { clearTimeout(this.brTimer); this.loadBranches(u.value.trim()); };

  },
  redraw() {

  },
  async start(url, name) {
    this.url = url; this.name = name || ''; this.err = '';
    if (!/^(https?:\/\/)?(www\.)?github\.com\/[\w.-]+\/[\w.-]+/i.test(url)) { this.err = 'Paste a GitHub repository link, e.g. https://github.com/owner/repo'; return this.redraw(); }

    if (!this.served) { location.href = this.LOCAL + '#import=' + encodeURIComponent(url) + (name ? '&name=' + encodeURIComponent(name) : '') + (this.branch ? '&branch=' + encodeURIComponent(this.branch) : ''); return; }
    this.state = 'running'; this.log = ['Starting import…']; this.redraw();
    try {
      const r = await fetch('/api/import', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ url, name, branch: this.branch }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(d.error || (r.status === 404 || r.status === 501 ? 'No importer here — start the page with: python3 tools/flarebox_server.py' : 'HTTP ' + r.status));

    } catch (e) { this.state = 'idle'; this.err = e.message; this.redraw(); }
  },
  async poll() {
    try {
      const d = await (await fetch('/api/import/' + this.job)).json();
      this.log = d.log || [];
      if (d.state === 'running') { this.redraw(); return setTimeout(() => this.poll(), 1200); }
      if (d.state === 'done' && d.collection) {
        this.log.push(`Done — ${d.collection.count} of ${d.collection.found} VFX in the review collection. Reloading…`); this.redraw();

    } catch (e) { this.state = 'idle'; this.err = 'Lost contact with the server: ' + e.message; this.redraw(); }
  },
};

/* WebM export: render the effect in real time into a canvas stream. */
async function recordVideo(fx, btn) {
  const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm', 'video/mp4'];
  const type = window.MediaRecorder && types.find(t => MediaRecorder.isTypeSupported(t));
  if (!type) { toast('This browser cannot record video — try Chrome, Edge or Firefox.'); return; }
  const c = document.createElement('canvas'); c.width = 1280; c.height = 720;
  c.style.cssText = 'position:fixed;left:-9999px;top:0;width:1280px;height:720px';
  document.body.append(c);
  const g = c.getContext('2d'), bg = Viewer.bg === 'white' ? '#ffffff' : '#101318', dur = PRESETS[fx.preset].dur, loops = PRESETS[fx.preset].loop ? 2 : 1;
  const fxLayer = document.createElement('canvas'); fxLayer.width = 1280; fxLayer.height = 720; const fg = fxLayer.getContext('2d');
  const rec = new MediaRecorder(c.captureStream(30), { mimeType: type, videoBitsPerSecond: 6e6 }), chunks = [];
  rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  btn.disabled = true; toast(`Recording ${(dur * loops).toFixed(1)}s preview…`, (dur * loops + 1) * 1000);
  const done = new Promise(r => { rec.onstop = r; });
  rec.start(); const t0 = performance.now();
  await new Promise(res => {
    const frame = () => {
      const t = (performance.now() - t0) / 1000;
      g.fillStyle = bg; g.fillRect(0, 0, 1280, 720);
      if (fx.type === 'Flipbook') { const s = getSheet(fx, 'big'), f = Math.floor((t % dur) / dur * s.frames), cw = s.img.width / s.cols, ch = s.img.height / s.rows; g.drawImage(s.img, (f % s.cols) * cw, Math.floor(f / s.cols) * ch, cw, ch, 0, 0, 1280, 720); }
      else { renderFx(fg, 1280, 720, fx, Math.min(t, dur * loops - 1e-3), useAdd(fx, bg)); g.drawImage(fxLayer, 0, 0); }
      if (t < dur * loops) requestAnimationFrame(frame); else res();
    };
    frame();
  });
  rec.stop(); await done; c.remove(); btn.disabled = false;
  download(new Blob(chunks, { type }), `${slug(fx.name)}_preview.${type.includes('mp4') ? 'mp4' : 'webm'}`);
  toast('Preview video downloaded');
}

$('#upStyle').innerHTML = STYLES.map(c => `<option>${esc(c)}</option>`).join('');
$('#upType').innerHTML = TYPES.map(c => `<option>${esc(c)}</option>`).join('');
$('#upEng').innerHTML = ENGINES.map(e => `<label class="check"><input type="checkbox" value="${esc(e)}" ${e === 'Unity URP' ? 'checked' : ''}>${esc(e)}</label>`).join('');
// header gear → Settings tab (the tab itself can be scrolled out of view on narrow windows)
$('#settingsBtn').addEventListener('click', () => { setTab('settings'); const t = $('.tab[data-tab="settings"]'); if (t) t.scrollIntoView({ block: 'nearest', inline: 'nearest' }); });
$('#uploadBtn').addEventListener('click', () => { upFile = null; $('#upForm').reset(); $('#upEng input[value="Unity URP"]').checked = true; $('#dropTxt').innerHTML = '<b>Choose a file</b> or drop it here<small>MP4 · WebM · GIF · PNG/WebP sprite sheet — stays on this computer</small>'; $('#sheetFields').hidden = true; $('#upSubmit').disabled = true; $('#upDlg').showModal(); });
function detectFormat(f) {
  const n = f.name.toLowerCase(), t = f.type;
  if (t === 'video/mp4' || n.endsWith('.mp4')) return 'MP4';
  if (t === 'video/webm' || n.endsWith('.webm')) return 'WEBM';
  if (t === 'image/gif' || n.endsWith('.gif')) return 'GIF';
  if (/image\/(png|webp|jpeg)/.test(t) || /\.(png|webp|jpe?g)$/.test(n)) return 'Sprite sheet';
  return null;
}
function takeFile(f) {
  const fmtd = f && detectFormat(f);
  if (!fmtd) { toast('Unsupported file — use MP4, WebM, GIF or a PNG/WebP sprite sheet.'); return; }
  upFile = f;
  $('#dropTxt').innerHTML = `<b>${esc(f.name)}</b><small>${fmtd} · ${(f.size / 1024).toFixed(0)} KB — click to change</small>`;
  $('#sheetFields').hidden = fmtd !== 'Sprite sheet';
  if (fmtd === 'Sprite sheet') $('#upType').value = 'Flipbook';
  if (!$('#upName').value) $('#upName').value = f.name.replace(/\.[^.]+$/, '').replace(/[_-]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  $('#upSubmit').disabled = false;
}
$('#upFile').addEventListener('change', e => takeFile(e.target.files[0]));
const drop = $('#drop');
['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', e => takeFile(e.dataTransfer.files[0]));
$('#upForm').addEventListener('submit', async e => {
  e.preventDefault(); if (!upFile) return;
  const format = detectFormat(upFile), id = 'u-' + Date.now().toString(36);
  const engines = $$('#upEng input:checked').map(i => i.value);
  const tags = $('#upTags').value.split(',').map(s => s.trim().toLowerCase()).filter(Boolean);
  const meta = {
    name: $('#upName').value.trim() || 'Untitled VFX', cat: $('#upCat').value, style: $('#upStyle').value, type: $('#upType').value,
    engines: engines.length ? engines : ['Unity URP'], tags: [...new Set([...tags, $('#upCat').value.toLowerCase(), format.toLowerCase()])],
    author: 'You', authorColor: '#1d2731', views: 0, favs: 0, date: Date.now(), staff: false, dl: true, loop: true,
    bg: '#13161d', format, fileName: upFile.name, desc: 'Uploaded from this computer.',
    sheet: format === 'Sprite sheet' ? { cols: clamp(+$('#upCols').value || 1, 1, 64), rows: clamp(+$('#upRows').value || 1, 1, 64), fps: clamp(+$('#upFps').value || 24, 1, 120) } : null,
  };
  const rec = { id, meta, blob: upFile };
  const saved = await DB.put(rec);
  ITEMS.unshift(uploadToItem(rec));
  $('#upDlg').close();
  if (state.tab !== 'all') setTab('all'); else applyState();
  toast(saved === null && !DB.db ? 'Added for this session (browser storage unavailable)' : `“${meta.name}” added to your library`);
});

/* =====================================================================
   Boot
   ===================================================================== */
Viewer.bg = ['dark', 'white', 'checker'].includes(LS.get('bg', 'dark')) ? LS.get('bg', 'dark') : 'dark';
applyState();
let rTimer;
window.addEventListener('resize', () => { clearTimeout(rTimer); rTimer = setTimeout(() => { for (const pl of cardPlayers.values()) if (!pl.playing) pl.render(); if (Viewer.player && !Viewer.player.playing) Viewer.player.render(); }, 150); });
(async () => {
  await DB.open();
  const recs = await DB.all();
  if (recs && recs.length) { recs.sort((a, b) => b.meta.date - a.meta.date); ITEMS = [...recs.map(uploadToItem), ...ITEMS]; applyState(); }
  const m = location.hash.match(/^#fx=(.+)$/);
  if (m && byId(decodeURIComponent(m[1]))) Viewer.open(decodeURIComponent(m[1]));
  // arrived from the file:// page with a GitHub link → pre-fill the import form (the user still presses Import)
  const im = location.hash.match(/^#import=([^&]+)(?:&name=([^&]*))?(?:&branch=(.*))?$/);
  if (im) {
    Importer.url = decodeURIComponent(im[1]); Importer.name = im[2] ? decodeURIComponent(im[2]) : ''; Importer.branch = im[3] ? decodeURIComponent(im[3]) : '';
    history.replaceState(null, '', location.pathname + location.search);
    setTab('scans'); const b = $('.gh-import button[type="submit"]'); if (b) b.focus();
    toast('Link filled in — press “Import to collection” to start');
  }
  // just finished a GitHub import → open its review collection
  let openCol = null; try { openCol = sessionStorage.getItem('flarebox.openCol'); sessionStorage.removeItem('flarebox.openCol'); } catch (e) { /* ignore */ }
  if (openCol && store.cols.some(c => c.id === openCol)) { setTab('cols'); state.col = openCol; applyState(); }
})();
</script>
</body>
</html>
